[package]
name = "claude-sessions"
version = "0.2.0-rc1"
edition = "2024"
rust-version = "1.85"
description = "Per-directory Claude Code session stats, and move a directory together with its sessions"
license = "MIT"
publish = false
repository = "https://github.com/mrhihi/claude-sessions"

[features]
default = ["tui"]
tui = ["dep:ratatui"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ratatui = { version = "0.30", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"

[workspace]
members = ["xtask"]
